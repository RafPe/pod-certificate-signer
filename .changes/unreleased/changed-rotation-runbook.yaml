kind: Changed
body: The operations guide now carries a CA rotation runbook: budget up to ~6 minutes for a new CA to reach running workloads (kubelet's 5-minute ClusterTrustBundle normalization cache plus one pod sync period, which no flag shortens), rotate with an overlap window rather than as a swap, re-read `ca.crt` in the application because kubelet rewrites it without signalling anything, and treat a stuck `podCertificate` refresh as frozen trust anchors rather than assuming they are current.
