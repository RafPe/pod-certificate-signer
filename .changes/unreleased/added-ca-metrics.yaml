kind: Added
body: 'Two outages that were previously visible only in logs are now alertable. `podcertificatesigner_ca_expiration_timestamp_seconds` says when the signer will stop being able to issue - past that point requests requeue silently and pods sit in ContainerCreating - and `podcertificatesigner_ca_reload_last_success_timestamp_seconds` catches a reload loop that stopped, which no failure-based signal can, since a dropped watch or a wedged ticker produces no failures at all. Alongside them: `podcertificatesigner_ca_reload_attempts_total{result}` marks rotations and reload failures, `podcertificatesigner_ca_reload_consecutive_failures` crosses its threshold roughly five minutes before readiness flips, and `podcertificatesigner_trust_bundle_certificates` reports how many anchors the signer would publish. The four gauges are computed at scrape time from the loaded CA, so they cannot go stale relative to the reload loop. docs/operations.md carries the alert expressions.'
