kind: Fixed
body: 'The signer now refuses a CA certificate whose `NotBefore` lies more than five minutes ahead of its clock, instead of loading it and signing certificates no peer can verify. A not-yet-valid CA - typically one minted by an external PKI whose clock runs ahead of the node''s - previously passed validation, so the signer reported healthy while every leaf it issued failed chain verification on the peer side. Such material is now rejected at load like any other unusable CA: the last-good CA stays in place and keeps signing, the reload failure is logged as `CA certificate is not yet valid`, and the certificate is also kept out of the published ClusterTrustBundle, where the same check gates the previous-CA history. The five-minute tolerance is what keeps benign clock skew around a fresh rotation from turning into a reload failure.'
