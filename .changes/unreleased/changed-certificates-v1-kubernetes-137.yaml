kind: Changed
body: 'The signer now speaks the GA `certificates.k8s.io/v1` API and requires Kubernetes 1.37 or newer; the chart''s `kubeVersion` moves to `>= 1.37.0-0` and installs on older clusters are refused. Nothing needs enabling on the cluster any more: `PodCertificateRequest` and `ClusterTrustBundle` are served by default in 1.37, so the `PodCertificateRequest`, `ClusterTrustBundle` and `ClusterTrustBundleProjection` feature gates and the `certificates.k8s.io/v1beta1` runtime-config entry can all come out of your apiserver configuration. The GA type drops `spec.pkixPublicKey`, so the signer no longer honours it and reads the subject public key only from the PKCS#10 stub every 1.37 kubelet sends - a request that somehow carries neither is denied with `UnsupportedKeyType` rather than signed. The `-0` suffix on the version constraint is deliberate: it admits managed distributions whose version strings carry a suffix, such as `1.37.2-eks-abc123`, which semver reads as prereleases and a bare `>= 1.37.0` would reject.'
