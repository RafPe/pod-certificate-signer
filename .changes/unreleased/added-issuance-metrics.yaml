kind: Added
body: 'Issuance is now measurable. `podcertificatesigner_podcertificaterequests_total{outcome,reason}` counts terminal outcomes and carries the signer''s SLI - a denial returns success from the reconciler, so controller-runtime''s own counters record it as one. `podcertificatesigner_podcertificaterequest_requeues_total{reason}` counts retries separately, so `{reason="CASignerUnusable"}` rising with nothing terminal alongside it names the case where requests hang and pods sit in ContainerCreating. `podcertificatesigner_podcertificaterequest_drops_total` counts requests dropped because their pod is gone, which previously left only an Event behind. No label carries a pod, namespace or request identity, so the number of series does not grow with the cluster.'
