kind: Changed
body: "`${...}` annotation interpolation is now enabled by default (`--enable-annotation-interpolation=true`, Helm `signer.enable_annotation_interpolation: true`), so per-pod SPIFFE-style identity works out of the box. This is a usability change, not a security relaxation: placeholders resolve only from apiserver-verified request fields, and every resolved value is still checked against the pod's verified identity by exact string equality, so no identity becomes issuable that was not issuable before. Nothing that worked stops working; set the value to `false` to restore the previous behaviour of denying values that contain `${...}`. See docs/adr/0002-annotation-interpolation-on-by-default.md."
