kind: Fixed
body: Previous-CA history read back from the ClusterTrustBundle at startup is now validated and trimmed to `--max-previous-ca-certs` instead of adopted verbatim, so an edited bundle is repaired by the next publish rather than becoming permanent history, and the published window never exceeds the configured bound. History is also kept by certificate identity and recency rather than insertion order, so rotating back into a CA the window already holds no longer evicts one whose certificates are still in use. A missing bundle is now reported as absence rather than as an empty history: startup still continues (a first install has no bundle) but says so loudly, and the new `--require-ca-history` / `signer.require_ca_history` makes it fail closed once the signer has published its bundle.
