kind: Added
body: 'A Grafana dashboard over the signer''s metric surface ships at `docs/dashboards/pod-certificate-signer.json`. Panels read through a `datasource` dashboard variable rather than a hardcoded datasource uid, so it resolves to the default Prometheus on import with nothing to edit. The operations guide says which panels sit at zero on a healthy cluster and why, so a zero is not read as a broken panel. The metrics-authentication walkthrough now also carries a plain Prometheus `scrape_config` alongside the `ServiceMonitor`, and spells out that the metrics-reader ClusterRole is named from the chart''s fullname helper - a release called `pcs` renders `pcs-pod-certificate-signer-metrics-reader`, and binding a name that does not exist returns 403 on every scrape with nothing in the controller log to explain it.'
