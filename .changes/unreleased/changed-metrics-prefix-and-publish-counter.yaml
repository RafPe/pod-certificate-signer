kind: Changed
body: 'The `ctb_publish_failures_total` metric is renamed to `podcertificatesigner_clustertrustbundle_publish_attempts_total`, and counts every publish attempt by result rather than only the failures - replace an alert on the old name with `increase(podcertificatesigner_clustertrustbundle_publish_attempts_total{result="failed"}[15m]) > 0`. Counting successes too makes a zero failure count interpretable: `{result="unchanged"}` standing still is a leader that stopped publishing, and `{result="updated"}` without a CA rotation to explain it is somebody editing the cluster trust anchors out from under the signer. All custom metrics now carry the `podcertificatesigner_` prefix, and the surface they belong to is bounded by ADR-0005.'
