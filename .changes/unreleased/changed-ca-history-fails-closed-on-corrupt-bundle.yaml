kind: Changed
body: 'A `CERTIFICATE` block in the signer''s existing ClusterTrustBundle that does not parse now fails startup closed, like a read error does, instead of being skipped with a log line. The bundle is the controller''s only record of its previous-CA history, so a silently shortened history would have been written back on the next publish. A corrupt bundle is not retried either: it reads back the same every time, so startup fails on the first read instead of spending the retry budget.'
