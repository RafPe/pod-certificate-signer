---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "podcertificate-signer.fullname" . }}
  labels:
    {{- include "podcertificate-signer.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
# Pods are read directly (uncached) by name during reconcile; get-only, with no
# list/watch, so the controller does not run a cluster-wide pod informer.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
- apiGroups:
  - certificates.k8s.io
  resources:
  - podcertificaterequests
  verbs:
  - get
  - list
  - watch
# The controller updates the status subresource when issuing certificates
# or recording terminal failures.
- apiGroups:
  - certificates.k8s.io
  resources:
  - podcertificaterequests/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - certificates.k8s.io
  resources:
  - clustertrustbundles
  verbs:
  - get
  - create
  - update
  - patch
- apiGroups:
  - certificates.k8s.io
  resources:
  - signers
  resourceNames:
  - {{ .Values.signer.name | quote }}
  verbs:
  - sign
  - attest
