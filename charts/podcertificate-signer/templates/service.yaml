{{- if .Values.service.create -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "podcertificate-signer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "podcertificate-signer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if .Values.metrics.enable_scraping }}
    - port: {{ .Values.metrics.bind_address | trimPrefix ":" }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "podcertificate-signer.selectorLabels" . | nindent 4 }}
{{- end }}
