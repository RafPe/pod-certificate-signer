apiVersion: v2
name: podcertificate-signer
description: A Helm chart for the PodCertificateRequest Signer

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.0

# This is the version number of the application being deployed. It is the
# default image tag when image.tag is not set. Both the chart version and
# appVersion are overridden by the release workflow when the chart is packaged
# and pushed to GHCR ("X.Y.Z" / "vX.Y.Z"); "latest" here keeps installs from a
# source checkout working without extra flags.
appVersion: "latest"

# Kubernetes version constraint
kubeVersion: ">= 1.35.0"

home: https://github.com/rafpe/pod-certificate-signer
sources:
  - https://github.com/rafpe/pod-certificate-signer
maintainers:
  - name: RafPe
    url: https://github.com/RafPe

annotations:
  # Metadata consumed by Artifact Hub (https://artifacthub.io) to enrich the
  # chart listing. Registration is a one-time manual step — see
  # docs/artifact-hub.md.
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/RafPe/pod-certificate-signer
    - name: Documentation
      url: https://github.com/RafPe/pod-certificate-signer/tree/main/docs
    - name: Security policy
      url: https://github.com/RafPe/pod-certificate-signer/blob/main/SECURITY.md
  # Image scanned/displayed by Artifact Hub. The release workflow rewrites this
  # tag to the released version when it packages the chart (see
  # docs/artifact-hub.md), so the value below only applies to source checkouts.
  artifacthub.io/images: |
    - name: pod-certificate-signer
      image: ghcr.io/rafpe/pod-certificate-signer:v1.2.1
  # No artifacthub.io/signKey: release images are signed with cosign keyless
  # (Fulcio/Rekor, no static public key), which Artifact Hub detects on its own.
  # The verification recipe lives in docs/artifact-hub.md.
