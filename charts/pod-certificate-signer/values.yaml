# Default values for pod-certificate-signer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# The chart README lists every value with its default.

# Number of controller replicas. Leader election selects one active replica.
# The chart ignores this value when autoscaling.enabled is true.
# See https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 2

# Health settings. The chart renders bind_address as the container port and as
# the --health-probe-bind-address flag.
health:
  bind_address: ":8081"

# Leader election settings
leader_election:
  enabled: true

# Log settings
log:
  encoder: console        # json or console
  level: info             # info, error, debug or panic
  time_encoding: rfc3339  # epoch, millis, nano, iso8601, rfc3339 or rfc3339nano

# Metrics settings
metrics:
  # Expose the metrics port on the Service, and add the Prometheus scrape
  # annotations to the pod. This value is independent of the insecure value below.
  enable_scraping: true
  bind_address: ":9090"

  # Secure metrics endpoint (DEFAULT, recommended). When false, the controller
  # serves /metrics over HTTPS. Each scrape must authenticate with a Kubernetes
  # bearer token, which a TokenReview verifies. A SubjectAccessReview for GET on
  # the /metrics nonResourceURL must also authorize it. A scraper must send a
  # ServiceAccount token bound to the metrics-reader ClusterRole. It must also
  # trust the self-signed serving certificate of the controller, or skip
  # verification.
  #
  # BREAKING: unauthenticated plaintext scrapes that worked before now fail.
  # Set insecure: true ONLY to restore the legacy behavior (renders
  # --metrics-secure=false). See the chart README "Metrics authentication".
  insecure: false

  # Metrics-reader ClusterRole that grants GET on the /metrics nonResourceURL.
  # Bind it to the identity that Prometheus uses to scrape, through your own
  # ClusterRoleBinding or the ServiceAccount of a ServiceMonitor. The chart
  # ignores this value when metrics.insecure is true.
  reader:
    create: true

  # Optional NetworkPolicy that limits ingress to the metrics port. Disabled by
  # default. Thus it cannot silently block scrapers in clusters without a
  # NetworkPolicy controller. The chart creates it only when enable_scraping is
  # also true. When enabled, only sources that match the selectors below can
  # reach the metrics port. When both selectors are empty, all sources can
  # reach it. The health and readiness probe port stays open to all sources.
  networkPolicy:
    enabled: false
    # Namespace labels of allowed scrapers, e.g. {kubernetes.io/metadata.name: monitoring}.
    namespaceSelector: {}
    # Pod labels of allowed scrapers. When namespaceSelector is empty, this
    # matches only pods in the namespace of this release. To allow a scraper in
    # a different namespace, also set namespaceSelector.
    podSelector: {}

# PodCertificateRequest signer settings
signer:
  # Source of the signing CA (certificate and private key).
  #   secretRef - mount an existing Secret (RECOMMENDED). The private key stays
  #               in a Secret, and the chart adds a read-only volume for you.
  #               You do not set .Values.volumes or .Values.volumeMounts.
  #   file      - you supply the certificate and key files through
  #               .Values.volumes and .Values.volumeMounts, at the paths below
  #               (advanced, bring your own mount).
  ca:
    source: secretRef
    secretRef:
      # Name of an existing Secret (kubernetes.io/tls or Opaque) that holds the
      # CA certificate and key. REQUIRED when source=secretRef. The chart
      # projects only these two keys into the pod.
      name: ""
      certKey: tls.crt
      keyKey: tls.key
      mountPath: /app/signer/ca
    file:
      certPath: /app/signer/ca/tls.crt
      keyPath: /app/signer/ca/tls.key

  # Signer name. Required. There is no default, so set it explicitly
  # (e.g. --set signer.name=example.org/signer). With an empty value, the
  # controller stops at startup.
  name: ""

  # FQDN of the cluster. The signer uses it to make the default certificate DNS
  # names (<pod>.<ns>.pod.<fqdn> / <pod>.<ns>.svc.<fqdn>).
  cluster_fqdn: cluster.local

  # Maximum number of previous CA certificates to keep across CA rotations.
  max_previous_ca_certs: 2

  # Refuse to start when the ClusterTrustBundle of the signer does not exist.
  # When false, the controller starts with an empty previous-CA history.
  #
  # Disabled by default, because a first install has no bundle. The controller
  # cannot tell a missing bundle from a deleted bundle. Enable it after the
  # signer publishes its bundle. Then a deleted bundle cannot silently reset the
  # retained CA history. Without that history, certificates from a retired CA
  # stop verifying.
  require_ca_history: false

  # Allow ${...} placeholders (e.g. ${pod.name}, ${pod.serviceAccountName}) in
  # certificate configuration annotations. The signer resolves them from the
  # verified fields of the PodCertificateRequest. Enabled by default. A value on
  # a pod template is the same for every replica, so placeholders are the only
  # way to set an identity for each pod.
  #
  # Placeholders resolve only from apiserver-verified request fields and the
  # cluster_fqdn value above. Each resolved value must pass the identity
  # constraints below by exact string equality, as a literal value must. Thus
  # interpolation gives no identity that the pod does not already own. It
  # changes how you write an identity, not which identities you can get. The
  # security gate is allow_unverified_identities, not this flag. See the
  # "Interpolating pod identity into values" section of docs/configuration.md
  # and docs/adr/0002-annotation-interpolation-on-by-default.md.
  #
  # Set to false to deny all values that contain ${...}. Keep this value equal
  # to defaultEnableAnnotationInterpolation in cmd/podcertificate-signer/main.go.
  enable_annotation_interpolation: true

  # Feature flag: use the DNS and IP SANs in the kubelet-generated PKCS#10 CSR
  # when no SAN annotation overrides them. At this time, kubelet generates
  # empty CSRs. KEP-4317 describes SANs that a pod author requests through the
  # CSR. This flag prepares for that support.
  # https://github.com/kubernetes/enhancements/tree/master/keps/sig-auth/4317-pod-certificates
  honor_csr_sans: false

  # Security flag. When false (the default), annotation cn/san/ip-san/uris
  # values must resolve to the apiserver-verified identity of the requesting
  # pod: its name, its canonical DNS and SPIFFE forms, and its service account.
  # The signer denies all other values. Thus a pod cannot get a certificate for
  # an identity that it does not own. IP SANs have no verified derivation, so
  # the signer always denies them while this value is false. Set it to true ONLY
  # when you trust pod authors to request any identity. See the chart README
  # "Identity constraints" section. This value sets the
  # --allow-unverified-identities controller flag.
  allow_unverified_identities: false

  # Deprecated fallback. The signer reads configuration items from the
  # annotations of the pod when spec.unverifiedUserAnnotations of the
  # PodCertificateRequest does not contain them. Enabled by default until
  # version 4.0.0 removes the fallback. Set to false when all workloads use
  # spec.unverifiedUserAnnotations. Then pod annotations stop being a second
  # input that the requester controls. Keep this value equal to
  # defaultAllowPodAnnotations in cmd/podcertificate-signer/main.go.
  allow_pod_annotations: true

# Issuance audit record settings. When enabled, the controller writes one JSON
# line to stdout for each signing attempt and each terminal outcome. The
# operational log stays on stderr. See docs/auditing.md.
audit:
  # Write the audit records. Enabled by default. Keep this value equal to
  # defaultAuditEnabled in cmd/podcertificate-signer/main.go.
  enabled: true
  # Pod label keys to copy into each record. Each entry is an exact key or a
  # prefix that ends in "*", e.g. [team, "app.kubernetes.io/*"]. A bare "*"
  # copies all labels. Empty by default, so a record copies no labels.
  pod_labels: []
  # Pod annotation keys to copy into each record. The entries have the same
  # format as pod_labels, but a bare "*" is not allowed. Empty by default.
  pod_annotations: []
  # Maximum number of labels that a record copies, and separately of
  # annotations. 1 to 256.
  max_copied_keys: 32
  # Maximum length in bytes of each copied value. The controller cuts a longer
  # value and marks it as truncated. 1 to 4096.
  max_value_length: 256
  # Maximum size in bytes of one record line. The controller removes the copied
  # annotations, then the labels, then the supplied values from a longer
  # record. 4096 to 262144.
  max_record_bytes: 16384
  # Add the raw values of the supplied certificate configuration annotations to
  # each record. When false, a record has only their names. The values come
  # from the requester, so enable this only when your audit log may hold them.
  record_supplied_values: false

# Optional ValidatingAdmissionPolicies. You can select each policy
# independently. These cluster-scoped policies give feedback when the API server
# admits Pods. Signer-side validation stays authoritative, also when all
# policies are disabled.
admissionPolicies:
  # Validates explicit DNS SANs that Pods request for this signer through
  # projected podCertificate userAnnotations. The policy first expands the
  # interpolation values that are available at Pod admission.
  dnsSANValidation:
    enabled: false
    # Supported modes: Deny, or Warn/Audit during a staged rollout. Kubernetes
    # does not permit Deny and Warn in the same binding.
    validationActions:
      - Deny
    # Empty selectors apply the binding to Pods in every namespace.
    namespaceSelector: {}
    objectSelector: {}

# Controller manager settings
manager:
  # Maximum number of concurrent reconciles
  max_concurrent_reconciles: 5
  # Maximum duration of a reconcile before it times out
  reconcile_timeout: "5m"

# Container image. See https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/rafpe/pod-certificate-signer
  # Image pull policy.
  pullPolicy: IfNotPresent
  # Overrides the image tag. The default is the chart appVersion, which the
  # release workflow sets to the release tag when it publishes the chart. Also
  # accepts a sha256:... digest.
  tag: ""

# Secrets to pull the image from a private registry. See
# https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# Overrides for the chart name and for the full name of the chart resources.
nameOverride: ""
fullnameOverride: ""

# ServiceAccount settings. See https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Create a ServiceAccount.
  create: true
  # Mount the API credentials of the ServiceAccount.
  automount: true
  # Annotations to add to the ServiceAccount.
  annotations: {}
  # Name of the ServiceAccount to use.
  # When empty and create is true, the chart makes a name from the fullname template.
  name: ""

# Kubernetes annotations to add to the Pod.
# See https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# Kubernetes labels to add to the Pod.
# See https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# The defaults comply with the "restricted" Pod Security Standard. Thus you can
# deploy the controller into namespaces that enforce it. The image runs as a
# non-root user (distroless nonroot).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  # fsGroup: 2000

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Service settings. See https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # Create a Service.
  create: true
  # Service type. See https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # Service port that targets the http (health) container port. See
  # https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# Container resource requests and limits. Conservative production defaults for
# a lightweight controller that is idle most of the time. The requests reserve
# a small baseline, so the pod can be scheduled. The limits cap bursts during
# reconcile storms, and the memory limit stops a runaway process. Change them
# for the size of your cluster. Set to {} to remove all limits.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Liveness and readiness probes. See
# https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /readyz
    port: http

# PodDisruptionBudget for the controller. The default replicaCount is 2: one
# active leader and one warm standby. With minAvailable: 1, a node drain evicts
# one replica at a time, and one pod can always hold the lease.
# unhealthyPodEvictionPolicy: AlwaysAllow lets a node drain evict a pod that is
# not healthy (e.g. not Ready). Thus a bad replica can never block a drain.
# NOTE: if you enable the HPA and it scales the Deployment down to 1,
# minAvailable: 1 blocks node drains for the single pod. In that case, change
# to maxUnavailable: 1.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # Set maxUnavailable instead of minAvailable. The two values are mutually
  # exclusive. When both are set, minAvailable wins.
  maxUnavailable: ""
  unhealthyPodEvictionPolicy: AlwaysAllow

# HorizontalPodAutoscaler settings. See
# https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
