# Default values for pod-certificate-signer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 2

# Health settings
health:
  bind_address: ":8081"

# Leader election settings
leader_election:
  enabled: true

# Log settings
log:
  encoder: console        # json or console
  level: info             # info, error, debug or panic
  time_encoding: rfc3339  # epoch, millis, nano, iso8601, rfc3339 or rfc3339nano

# Metrics settings
metrics:
  enable_scraping: true
  bind_address: ":9090"

# PodCertificateRequest Signer settings
signer:
  # Signing CA (certificate + private key) source.
  #   secretRef — mount an existing Secret (RECOMMENDED). The private key stays in
  #               a Secret and the chart wires a read-only volume for you; nothing
  #               to plumb under .Values.volumes/.volumeMounts.
  #   file      — you provide the cert/key files yourself via .Values.volumes and
  #               .Values.volumeMounts at the paths below (advanced / BYO mount).
  ca:
    source: secretRef
    secretRef:
      # Name of an existing Secret (kubernetes.io/tls or Opaque) holding the CA
      # cert and key. REQUIRED when source=secretRef; only these two keys are
      # projected into the pod.
      name: ""
      certKey: tls.crt
      keyKey: tls.key
      mountPath: /app/signer/ca
    file:
      certPath: /app/signer/ca/tls.crt
      keyPath: /app/signer/ca/tls.key

  # Name of the signer. Required - there is no default, so it must be set
  # explicitly (e.g. --set signer.name=example.org/signer). An empty value
  # makes the controller fail fast at startup.
  name: ""

  # FQDN of the cluster, used to build the default certificate DNS names
  # (<pod>.<ns>.pod.<fqdn> / <pod>.<ns>.svc.<fqdn>).
  cluster_fqdn: cluster.local

  # Max number of previous CA certificates to keep during a CA cert reload
  max_previous_ca_certs: 2

  # Feature flag: allow ${...} placeholders (e.g. ${pod.name},
  # ${pod.serviceAccountName}) in certificate configuration annotations,
  # resolved from the verified fields of the PodCertificateRequest.
  enable_annotation_interpolation: false

  # Feature flag: honor DNS and IP SANs embedded in the kubelet-generated
  # PKCS#10 CSR when no SAN annotation overrides them. Kubelet generates
  # empty CSRs today; this prepares for upcoming Kubernetes support for
  # requesting SANs on the projected volume.
  honor_csr_sans: false

  # Security flag: when false (the default), annotation-provided cn/san/ip-san/uris
  # values must resolve to the requesting pod's apiserver-verified identity (its
  # name, canonical DNS/SPIFFE forms and its service account); any other value is
  # denied, so a pod cannot obtain a certificate for an identity it does not own.
  # IP SANs have no verified derivation and are always denied while this is false.
  # Set to true ONLY if you intentionally trust pod authors to request arbitrary
  # identities - see the chart README "Identity constraints" section. This is the
  # Helm escape hatch for the --allow-unverified-identities controller flag.
  allow_unverified_identities: false

# Controller manager settings
manager:
  # Max concurrent reconciles
  max_concurrent_reconciles: 5
  # Max duration before a reconcile times out
  reconcile_timeout: "5m"

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/rafpe/pod-certificate-signer
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion (set to the
  # release tag when the chart is published). Also accepts a sha256:... digest.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# The defaults comply with the "restricted" Pod Security Standard, so the
# controller can be deployed into namespaces enforcing it. The image runs as
# a non-root user (distroless nonroot).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  # fsGroup: 2000

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # Specifies whether a service should be created
  create: true
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# Container resource requests/limits. Conservative production defaults for a
# lightweight, mostly-idle controller: requests reserve a small baseline so the
# pod schedules and keeps its Guaranteed share, while the limits cap bursts
# during reconcile storms and the memory limit guards against a runaway. Tune
# for your cluster size; set to {} to leave the container unconstrained.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /readyz
    port: http

# PodDisruptionBudget for the controller. With the default replicaCount of 2
# (leader-elected: one active, one warm standby), minAvailable: 1 lets a node be
# drained one replica at a time while always keeping a pod that can hold the lease.
# unhealthyPodEvictionPolicy: AlwaysAllow lets the node drain evict a pod that is
# already unhealthy (e.g. not yet Ready) so a bad replica can never wedge a drain.
# NOTE: if you enable the HPA and it scales the Deployment down to 1, minAvailable: 1
# blocks node drains for the sole pod — switch to maxUnavailable: 1 in that case.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # Set maxUnavailable instead of minAvailable (mutually exclusive; minAvailable
  # wins when both are set).
  maxUnavailable: ""
  unhealthyPodEvictionPolicy: AlwaysAllow

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
