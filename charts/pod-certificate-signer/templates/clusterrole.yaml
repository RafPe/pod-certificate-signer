---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pod-certificate-signer.fullname" . }}
  labels:
    {{- include "pod-certificate-signer.labels" . | nindent 4 }}
rules:
{{- if not .Values.metrics.insecure }}
# The secure metrics endpoint authenticates scrapers with a TokenReview and
# authorizes them with a SubjectAccessReview against the kube-apiserver, so the
# controller ServiceAccount must be able to create both. Omitted when
# metrics.insecure is set, since the plaintext endpoint performs no auth.
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
{{- end }}
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
# Pods are read directly (uncached) by name during reconcile; get-only, with no
# list/watch, so the controller does not run a cluster-wide pod informer.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
- apiGroups:
  - certificates.k8s.io
  resources:
  - podcertificaterequests
  verbs:
  - get
  - list
  - watch
# The controller updates the status subresource when issuing certificates
# or recording terminal failures.
- apiGroups:
  - certificates.k8s.io
  resources:
  - podcertificaterequests/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - certificates.k8s.io
  resources:
  - clustertrustbundles
  verbs:
  - get
  - create
  - update
  - patch
- apiGroups:
  - certificates.k8s.io
  resources:
  - signers
  resourceNames:
  - {{ .Values.signer.name | quote }}
  verbs:
  - sign
  - attest
