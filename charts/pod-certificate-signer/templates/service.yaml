{{- if .Values.service.create -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pod-certificate-signer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pod-certificate-signer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if .Values.metrics.enable_scraping }}
    - port: {{ .Values.metrics.bind_address | trimPrefix ":" }}
      targetPort: metrics
      protocol: TCP
      name: metrics
      # Secured metrics are served over HTTPS; advertise the scheme so
      # ServiceMonitors and clients pick TLS. Plain HTTP under the insecure hatch.
      appProtocol: {{ if .Values.metrics.insecure }}http{{ else }}https{{ end }}
    {{- end }}
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pod-certificate-signer.selectorLabels" . | nindent 4 }}
{{- end }}
