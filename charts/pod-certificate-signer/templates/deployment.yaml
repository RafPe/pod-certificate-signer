apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pod-certificate-signer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pod-certificate-signer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pod-certificate-signer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.metrics.enable_scraping }}
        prometheus.io/name: {{ include "pod-certificate-signer.fullname" . }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.bind_address | trimPrefix ":" | quote }}
        # When secured, the endpoint is HTTPS and requires a bearer token, so
        # annotation-based scraping cannot authenticate on its own - use a
        # ServiceMonitor with a token and TLS config (see the chart README).
        prometheus.io/scheme: {{ if .Values.metrics.insecure }}"http"{{ else }}"https"{{ end }}
        {{- end }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pod-certificate-signer.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pod-certificate-signer.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          command:
            - /manager
            - --leader-elect={{ .Values.leader_election.enabled }}
            - --leader-election-id={{ include "pod-certificate-signer.fullname" . }}
            - --leader-election-namespace={{ .Release.Namespace }}
            {{- include "pod-certificate-signer.validateCA" . }}
            - --ca-cert-path={{ include "pod-certificate-signer.caCertPath" . }}
            - --ca-key-path={{ include "pod-certificate-signer.caKeyPath" . }}
            - --signer-name={{ .Values.signer.name }}
            - --cluster-fqdn={{ .Values.signer.cluster_fqdn }}
            - --health-probe-bind-address={{ .Values.health.bind_address }}
            - --zap-log-level={{ .Values.log.level }}
            - --zap-encoder={{ .Values.log.encoder }}
            - --zap-time-encoding={{ .Values.log.time_encoding }}
            - --metrics-bind-address={{ .Values.metrics.bind_address }}
            - --metrics-secure={{ not .Values.metrics.insecure }}
            - --max-concurrent-reconciles={{ .Values.manager.max_concurrent_reconciles }}
            - --reconcile-timeout={{ .Values.manager.reconcile_timeout }}
            - --max-previous-ca-certs={{ .Values.signer.max_previous_ca_certs }}
            - --require-ca-history={{ .Values.signer.require_ca_history }}
            - --enable-annotation-interpolation={{ .Values.signer.enable_annotation_interpolation }}
            - --honor-csr-sans={{ .Values.signer.honor_csr_sans }}
            - --allow-unverified-identities={{ .Values.signer.allow_unverified_identities }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if hasPrefix "sha256:" .Values.image.tag }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.tag }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            {{- if .Values.metrics.enable_scraping }}
            - name: metrics
              containerPort: {{ .Values.metrics.bind_address | trimPrefix ":" }}
              protocol: TCP
            {{- end }}
            - name: http
              containerPort: {{ .Values.health.bind_address | trimPrefix ":" }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or (eq .Values.signer.ca.source "secretRef") .Values.volumeMounts }}
          volumeMounts:
            {{- if eq .Values.signer.ca.source "secretRef" }}
            - name: signing-ca
              mountPath: {{ .Values.signer.ca.secretRef.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (eq .Values.signer.ca.source "secretRef") .Values.volumes }}
      volumes:
        {{- if eq .Values.signer.ca.source "secretRef" }}
        - name: signing-ca
          secret:
            secretName: {{ .Values.signer.ca.secretRef.name }}
            optional: false
            # Project only the CA cert and key, never any other secret keys.
            items:
              - key: {{ .Values.signer.ca.secretRef.certKey }}
                path: {{ .Values.signer.ca.secretRef.certKey }}
              - key: {{ .Values.signer.ca.secretRef.keyKey }}
                path: {{ .Values.signer.ca.secretRef.keyKey }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
