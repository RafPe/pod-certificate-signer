{{- if and (not .Values.metrics.insecure) .Values.metrics.reader.create }}
---
# ClusterRole for scraping the secured metrics endpoint. The controller-runtime
# auth filter authorizes a GET on the /metrics nonResourceURL, so a scraper
# (e.g. Prometheus) must run under a ServiceAccount bound to this role. The
# chart does not bind it for you - create a ClusterRoleBinding to your scraper's
# ServiceAccount, or reference it from a ServiceMonitor's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pod-certificate-signer.fullname" . }}-metrics-reader
  labels:
    {{- include "pod-certificate-signer.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
{{- end }}
