apiVersion: v2
name: pod-certificate-signer
description: A Helm chart for the PodCertificateRequest Signer

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# Chart version, in Semantic Versioning (https://semver.org/). The release
# workflow replaces it with the release version ("X.Y.Z") when it packages the
# chart. Thus 0.1.0 applies only to installs from a source checkout.
version: 0.1.0

# Version of the application that the chart deploys. It is the default image
# tag when image.tag is not set. The release workflow replaces it with the
# release tag ("vX.Y.Z") when it packages the chart and pushes it to GHCR. With
# "latest", installs from a source checkout work without extra flags.
appVersion: "latest"

# Kubernetes version constraint. The signer serves certificates.k8s.io/v1,
# which is GA as of Kubernetes 1.37. The "-0" suffix is what admits managed
# distributions whose version strings carry a suffix ("1.37.2-eks-abc123"):
# semver reads those as prereleases of 1.37.2, which a bare ">= 1.37.0"
# constraint rejects.
kubeVersion: ">= 1.37.0-0"

home: https://github.com/rafpe/pod-certificate-signer
sources:
  - https://github.com/rafpe/pod-certificate-signer
maintainers:
  - name: RafPe
    url: https://github.com/RafPe

annotations:
  # Artifact Hub (https://artifacthub.io) reads this metadata for the chart
  # listing. Registration is a one-time manual step. See docs/artifact-hub.md.
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/RafPe/pod-certificate-signer
    - name: Documentation
      url: https://github.com/RafPe/pod-certificate-signer/tree/main/docs
    - name: Security policy
      url: https://github.com/RafPe/pod-certificate-signer/blob/main/SECURITY.md
  # Image that Artifact Hub scans and shows. The release workflow changes this
  # tag to the release version when it packages the chart (see
  # docs/artifact-hub.md). Thus the value below applies only to source checkouts.
  artifacthub.io/images: |
    - name: pod-certificate-signer
      image: ghcr.io/rafpe/pod-certificate-signer:v1.2.1
  # No artifacthub.io/signKey. The release workflow signs images with cosign
  # keyless signing (Fulcio/Rekor, no static public key). Artifact Hub finds
  # these signatures without a key. docs/artifact-hub.md gives the verification
  # procedure.
