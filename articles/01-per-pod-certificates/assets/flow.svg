<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1140" viewBox="0 0 1400 1140" role="img" aria-labelledby="title desc" font-family="-apple-system, 'SF Pro Rounded', 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Request flow</title><desc id="desc">Read left to right: kubelet, kube-apiserver, pod-certificate-signer. CA Secret is below the signer. Pod volume is below kubelet. Numbered arrows follow steps 1 to 5. Step 2 is verification at the kube-apiserver.</desc>
<defs>
<linearGradient id="bg"><stop stop-color="#faf6ea"/><stop offset="1" stop-color="#f3ebd6"/></linearGradient>
<linearGradient id="stripe"><stop stop-color="#2f63d6"/><stop offset="1" stop-color="#2a9d5c"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2f63d6"/></marker>
</defs>
<rect width="1400" height="1140" fill="url(#bg)"/><rect width="1400" height="8" fill="url(#stripe)"/><text x="40" y="76" font-size="36" font-weight="750" fill="#1f2a44">Request flow</text><rect x="40" y="300" width="380" height="180" rx="18" fill="white" stroke="#e3ddcb" stroke-width="2"/><text x="68" y="356" font-size="28" font-weight="700" fill="#1f2a44">kubelet</text><text x="68" y="408" font-size="23" fill="#5b6785"><tspan x="68" dy="0">generates the key,</tspan><tspan x="68" dy="32">creates the request</tspan></text><rect x="510" y="300" width="380" height="180" rx="18" fill="white" stroke="#e3ddcb" stroke-width="2"/><text x="538" y="356" font-size="28" font-weight="700" fill="#1f2a44">kube-apiserver</text><text x="538" y="408" font-size="23" fill="#5b6785"><tspan x="538" dy="0">verifies the identity fields</tspan></text><rect x="980" y="300" width="380" height="180" rx="18" fill="white" stroke="#e3ddcb" stroke-width="2"/><text x="1008" y="356" font-size="28" font-weight="700" fill="#1f2a44">pod-certificate-signer</text><text x="1008" y="408" font-size="23" fill="#5b6785"><tspan x="1008" dy="0">reads the pod, signs</tspan></text><rect x="980" y="760" width="380" height="180" rx="18" fill="white" stroke="#e3ddcb" stroke-width="2"/><text x="1008" y="816" font-size="28" font-weight="700" fill="#1f2a44">CA Secret</text><text x="1008" y="868" font-size="23" fill="#5b6785"><tspan x="1008" dy="0">podcertificate-signer-ca</tspan></text><rect x="40" y="760" width="380" height="180" rx="18" fill="white" stroke="#e3ddcb" stroke-width="2"/><text x="68" y="816" font-size="28" font-weight="700" fill="#1f2a44">Pod volume</text><text x="68" y="868" font-size="23" fill="#5b6785"><tspan x="68" dy="0">credentialbundle.pem, ca.crt</tspan></text><path d="M180 300 V170 H600 V300" fill="none" stroke="#2f63d6" stroke-width="3" marker-end="url(#arrow)"/><circle cx="390" cy="170" r="16" fill="#2f63d6"/><text x="390" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="white">1</text><text x="390" y="135" text-anchor="middle" font-size="21" fill="#1f2a44">create PodCertificateRequest</text><path d="M800 300 V170 H1170 V300" fill="none" stroke="#2f63d6" stroke-width="3" marker-end="url(#arrow)"/><circle cx="980" cy="170" r="16" fill="#2f63d6"/><text x="980" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="white">3</text><text x="980" y="135" text-anchor="middle" font-size="21" fill="#1f2a44">watch: request</text><path d="M890 340 H935 V440 H890" fill="none" stroke="#2f63d6" stroke-width="3" marker-end="url(#arrow)"/><circle cx="935" cy="390" r="16" fill="#2f63d6"/><text x="935" y="396" text-anchor="middle" font-size="18" font-weight="700" fill="white">2</text><path d="M1060 480 V550 H800 V480" fill="none" stroke="#2f63d6" stroke-width="3" marker-end="url(#arrow)"/><circle cx="930" cy="550" r="16" fill="#2f63d6"/><text x="930" y="556" text-anchor="middle" font-size="18" font-weight="700" fill="white">4</text><text x="930" y="515" text-anchor="middle" font-size="21" fill="#1f2a44">status: Issued + chain</text><path d="M600 480 V550 H180 V480" fill="none" stroke="#2f63d6" stroke-width="3" marker-end="url(#arrow)"/><circle cx="390" cy="550" r="16" fill="#2f63d6"/><text x="390" y="556" text-anchor="middle" font-size="18" font-weight="700" fill="white">5</text><text x="390" y="515" text-anchor="middle" font-size="21" fill="#1f2a44">read Issued status</text><path d="M100 480 V760" fill="none" stroke="#2f63d6" stroke-width="3" marker-end="url(#arrow)"/><circle cx="100" cy="660" r="16" fill="#2f63d6"/><text x="100" y="666" text-anchor="middle" font-size="18" font-weight="700" fill="white">5</text><text x="130" y="665" text-anchor="start" font-size="21" fill="#1f2a44">write key and chain</text><path d="M1170 760 V480" fill="none" stroke="#2f63d6" stroke-width="3" marker-end="url(#arrow)"/><circle cx="1170" cy="660" r="16" fill="#2f63d6"/><text x="1170" y="666" text-anchor="middle" font-size="18" font-weight="700" fill="white">4</text><text x="1140" y="665" text-anchor="end" font-size="21" fill="#1f2a44">sign with current CA</text><rect x="40" y="990" width="1320" height="74" rx="18" fill="#e8efff" stroke="#cbd8fa"/><text x="68" y="1037" font-size="27" font-weight="700" fill="#2f63d6">The private key never goes into the request or its status.</text><text x="40" y="1110" font-size="23" fill="#5b6785">The request flow has five steps when the signer issues the certificate.</text></svg>
