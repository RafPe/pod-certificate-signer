# EXAMPLE ONLY. Restrict which pods may request certificate configuration that
# claims an identity from pod-certificate-signer. The chart does not apply this
# policy. Apply it with `kubectl apply -f`.
#
# The signer already refuses a certificate for an identity that the pod does not
# own. See "Identity constraints" in docs/configuration.md. This policy applies
# the same rule at admission. With --allow-unverified-identities, the signer
# does not apply the constraints. Then this policy is the only control that
# stops a pod author from getting a certificate for a different identity.
#
# Apply it also with the default settings. The signer never receives a pod that
# this policy rejects. Thus the author gets an immediate, clear error. Without
# the policy, the author sees a pending volume and must read a Denied
# PodCertificateRequest.
#
# The rules:
#   1. cn / san / ip-san / uris claim an identity. Only pods in a namespace
#      with the label pcs.example.org/allow-signer-annotations=true may set them.
#   2. eku / duration / refresh only change the certificate that the pod can
#      already get. Thus any namespace may set them.
#   3. Any other key with the signer prefix is a typo. The signer denies such a
#      request. This policy shows the error in the kubectl output.
#
# Before you apply it, replace these values with your own:
#   - the signer name (matches examples/workload-pod.yaml)
#   - the annotation prefix (always "<signer name>-")
#   - the exemption label key
#
# Pods can also supply certificate configuration through the deprecated pod
# `annotations` path. The signer accepts this path by default until 4.0.0. To
# disable it, set --allow-pod-annotations=false (Helm:
# signer.allow_pod_annotations: false). Thus rule 1 covers both paths. If the
# policy checked only userAnnotations, a pod author could claim an identity
# through `metadata.annotations`. With --allow-unverified-identities and the
# default --allow-pod-annotations=true, that is a full bypass.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pcs-restrict-signer-user-annotations
spec:
  # Fail closed: if the kube-apiserver cannot evaluate the policy, it rejects
  # the pod.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # userAnnotations are on the projected volume of the pod. Thus the policy
      # checks pods. The kubelet creates the PodCertificateRequest later.
      #
      # The policy also matches UPDATE, because a pod can change the deprecated
      # pod `annotations` (rule 1) after creation. As a result, you cannot
      # update a pod that violates the policy until you correct it. This
      # includes adding an ephemeral debug container.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: signerName
      expression: '"example.org/signer"'
    - name: prefix
      expression: '"example.org/signer-"'
    # Keys that assert who the certificate is for.
    - name: identityKeys
      expression: >-
        [variables.prefix + "cn", variables.prefix + "san",
         variables.prefix + "ip-san", variables.prefix + "uris"]
    # Every key the signer understands.
    - name: knownKeys
      expression: >-
        variables.identityKeys + [variables.prefix + "eku",
         variables.prefix + "duration", variables.prefix + "refresh"]
    # Namespaces that may claim identities. The exemption is here, not in the
    # namespaceSelector of the binding, so the policy applies in all
    # namespaces. A selector disables the policy where it does not match. That
    # is the opposite of an allowlist.
    - name: exempt
      expression: >-
        has(namespaceObject.metadata.labels) &&
        "pcs.example.org/allow-signer-annotations" in namespaceObject.metadata.labels &&
        namespaceObject.metadata.labels["pcs.example.org/allow-signer-annotations"] == "true"
    # Each step of the path is optional in the pod schema. Thus each step has a
    # has() check. A pod with no volumes, a volume that is not projected, or a
    # podCertificate source with no userAnnotations must evaluate to false.
    - name: claimsIdentity
      expression: >-
        has(object.spec.volumes) && object.spec.volumes.exists(volume,
          has(volume.projected) && has(volume.projected.sources) &&
          volume.projected.sources.exists(source,
            has(source.podCertificate) &&
            source.podCertificate.signerName == variables.signerName &&
            has(source.podCertificate.userAnnotations) &&
            source.podCertificate.userAnnotations.exists(key,
              key in variables.identityKeys)))
    # The same identity keys in the deprecated pod `annotations` path. This
    # check does not read the volumes. The keys have the signer prefix, so a
    # key on the pod is unambiguous.
    - name: claimsIdentityViaPodAnnotations
      expression: >-
        has(object.metadata.annotations) &&
        object.metadata.annotations.exists(key, key in variables.identityKeys)
    - name: usesUnknownKey
      expression: >-
        has(object.spec.volumes) && object.spec.volumes.exists(volume,
          has(volume.projected) && has(volume.projected.sources) &&
          volume.projected.sources.exists(source,
            has(source.podCertificate) &&
            source.podCertificate.signerName == variables.signerName &&
            has(source.podCertificate.userAnnotations) &&
            source.podCertificate.userAnnotations.exists(key,
              key.startsWith(variables.prefix) && !(key in variables.knownKeys))))
  validations:
    - expression: >-
        variables.exempt ||
        !(variables.claimsIdentity || variables.claimsIdentityViaPodAnnotations)
      reason: Forbidden
      message: >-
        This namespace may not set the cn, san, ip-san or uris keys - as
        userAnnotations on a podCertificate volume or as pod annotations -
        because those claim a certificate identity. Use
        ${...} interpolation of the pod's own verified identity, or ask a cluster
        administrator to label the namespace
        pcs.example.org/allow-signer-annotations=true.
    - expression: "!variables.usesUnknownKey"
      reason: Invalid
      message: >-
        A userAnnotation uses the signer's prefix but is not a key the signer
        recognises. Supported keys are cn, san, ip-san, uris, eku, duration and
        refresh; anything else would be denied when the certificate is requested.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pcs-restrict-signer-user-annotations
spec:
  policyName: pcs-restrict-signer-user-annotations
  # Deny immediately. On an existing cluster, first set [Audit, Warn] to see
  # which pods the policy rejects. Then set [Deny].
  validationActions: [Deny]
  # No matchResources: the policy applies in all namespaces. The label check in
  # the policy decides the exemption.
