# Example workload that requests a certificate from pod-certificate-signer.
#
# The userAnnotations on the podCertificate projected volume source set the
# certificate configuration. The kubelet copies them without change into
# spec.unverifiedUserAnnotations of the PodCertificateRequest. The controller
# resolves the ${...} placeholders by default. A controller started with
# --enable-annotation-interpolation=false (Helm:
# signer.enable_annotation_interpolation: false) denies them.
#
# Each value below resolves to an identity that this pod owns. The signer
# derives these identities from the verified fields of the
# PodCertificateRequest. Thus the signer issues this manifest under the default
# identity constraints, without --allow-unverified-identities. A value that the
# pod cannot prove (a literal name, an IP address) needs that flag. The
# commented ip-san below is an example.
#
# The volume also mounts the ClusterTrustBundle of the signer. Thus the pod
# gets these files:
#   /var/run/x509/credentialbundle.pem - private key + issued certificate chain
#   /var/run/x509/ca.crt               - CA bundle to verify peer certificates
#
# The signer name example.org/signer is the value that docs/getting-started.md
# and `make helm-deploy` install.
#
# The e2e suite (test/e2e) also applies this manifest. It asserts the pod name,
# namespace and annotation values below. Keep them in sync.
apiVersion: v1
kind: Pod
metadata:
  name: pcs-example-workload
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: sleeper
    image: busybox:1.37
    command: ["sleep", "600"]
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 65532
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
    - name: x509
      mountPath: /var/run/x509
      readOnly: true
  volumes:
  - name: x509
    projected:
      sources:
      - podCertificate:
          keyType: ED25519
          signerName: example.org/signer
          credentialBundlePath: credentialbundle.pem
          userAnnotations:
            # The canonical Service DNS name of the pod. The example uses
            # ${cluster.fqdn}, not a fixed cluster.local, so it also works for a
            # controller with a different --cluster-fqdn.
            example.org/signer-cn: "${pod.name}.${pod.namespace}.svc.${cluster.fqdn}"
            # The canonical service form of the pod, and the short
            # service-account form <sa>.<ns>. The service-account Service DNS
            # form <sa>.<ns>.svc is intentionally not in the verified-identity
            # allowlist. The signer denies it. See
            # docs/adr/0001-verified-identity-allowlist-boundary.md.
            example.org/signer-san: "${pod.name}.${pod.namespace}.svc,${pod.serviceAccountName}.${pod.namespace}"
            # The SPIFFE ID of the service account of this pod. This is the
            # approved form of the service-account identity (ADR-0001).
            example.org/signer-uris: "spiffe://${cluster.fqdn}/ns/${pod.namespace}/sa/${pod.serviceAccountName}"
            # Intentionally commented. An IP address has no verified derivation
            # from the request. Thus the signer denies an ip-san unless the
            # controller runs with --allow-unverified-identities (Helm:
            # signer.allow_unverified_identities=true). Remove the comment
            # marker only for a signer with that flag:
            # example.org/signer-ip-san: "10.96.0.99"
      - clusterTrustBundle:
          signerName: example.org/signer
          labelSelector: {}
          path: ca.crt
