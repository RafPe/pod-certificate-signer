# EXAMPLE ONLY. Restrict the certificate Extended Key Usage (EKU) that a
# workload may request from pod-certificate-signer, per namespace.
#
# The signer accepts only the `client` and `server` EKU tokens. It does not
# restrict which pod requests which token. Any pod may request `eku: client`.
# EKU only changes a certificate that the pod can already get. Thus
# --allow-unverified-identities does not control it. If only some namespaces
# may request client auth, enforce that at admission with a
# ValidatingAdmissionPolicy like this one.
#
# Model: the namespace label `pcs.example.org/eku-profile` selects the allowed
# tokens:
#   (unset) or "server" -> server only  (matches the signer default)
#   "client"            -> client only
#   "both"              -> server and client
# The policy denies a Pod if its podCertificate projection requests an `eku`
# value that the namespace profile does not allow.
#
# Change `signerName`, the label key and the match rules of the binding for
# your environment. Before you enforce it, test it on your target cluster with
# `kubectl apply --dry-run=server`. The chart does not apply this policy. Apply
# it with `kubectl apply -f`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pcs-eku-by-namespace
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: signerName
      expression: "'example.org/signer'"
    - name: ekuKey
      expression: "variables.signerName + '-eku'"
    # The EKU tokens this namespace may request, from its eku-profile label.
    - name: profile
      expression: >-
        has(namespaceObject.metadata.labels) && 'pcs.example.org/eku-profile' in namespaceObject.metadata.labels
          ? namespaceObject.metadata.labels['pcs.example.org/eku-profile']
          : 'server'
    - name: allowedEku
      expression: >-
        variables.profile == 'both' ? ['server', 'client']
          : (variables.profile == 'client' ? ['client'] : ['server'])
  validations:
    # Each podCertificate projection for this signer that sets an `eku` value
    # must request only tokens that the namespace allows. The policy does not
    # change pods with no volumes, no podCertificate projection or no eku
    # annotation.
    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v,
          !has(v.projected) || !has(v.projected.sources) ||
          v.projected.sources.all(s,
            !has(s.podCertificate) ||
            s.podCertificate.signerName != variables.signerName ||
            !has(s.podCertificate.userAnnotations) ||
            !(variables.ekuKey in s.podCertificate.userAnnotations) ||
            s.podCertificate.userAnnotations[variables.ekuKey].split(',').all(token,
              token.trim() in variables.allowedEku)
          )
        )
      messageExpression: >-
        'namespace ' + namespaceObject.metadata.name +
        ' may only request certificate EKU [' + variables.allowedEku.join(', ') +
        '] for signer ' + variables.signerName +
        ' — widen it via the pcs.example.org/eku-profile namespace label (server|client|both)'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pcs-eku-by-namespace
spec:
  policyName: pcs-eku-by-namespace
  validationActions: ["Deny"]
  # Applies to all namespaces. For a namespace without the label, the policy
  # allows server only. To apply it to fewer namespaces, set
  # spec.matchResources.namespaceSelector.
  matchResources: {}
