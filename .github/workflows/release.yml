name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to recover
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: "release:verify"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'release/next' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'autorelease: pending'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            sha=$(git rev-list -n 1 "${tag}")
          else
            case "${PR_TITLE}" in
              "chore: release v"*) tag="${PR_TITLE#chore: release }" ;;
              *) echo "::error::release PR title must be 'chore: release vX.Y.Z'"; exit 1 ;;
            esac
            sha="${MERGE_SHA}"
          fi
          echo "${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::invalid release tag"; exit 1; }
          git merge-base --is-ancestor "${sha}" origin/main || { echo "::error::release commit is not on main"; exit 1; }
          grep -q "^## \[${tag#v}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md lacks ${tag}"; exit 1; }
          if find .changes/unreleased -name '*.yaml' -print -quit | grep -q .; then
            echo "::error::unbatched changelog fragments remain"; exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

  check:
    name: "release:check"
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test vet
      - run: sh scripts/release-contract-check.sh

  e2e:
    name: "release:e2e"
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/test-e2e.yml
    with:
      target_ref: ${{ needs.verify.outputs.sha }}

  tag:
    name: "release:tag"
    needs: [verify, check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The tag is created through the REST API rather than `git push`.
      #
      # A tag push authenticated with GITHUB_TOKEN is refused whenever the
      # tagged commit's .github/workflows/ differ from the tip of every branch:
      #
      #   ! [remote rejected] vX.Y.Z -> vX.Y.Z (refusing to allow a GitHub App
      #     to create or update workflow `.github/workflows/...` without
      #     `workflows` permission)
      #
      # That is the normal case here, not an edge one. This job runs after
      # verify, check and E2E, so anything merged to main in those ~20 minutes
      # moves the tip out from under the release commit. It is what broke
      # v2.4.0: #127 landed 8 minutes after the release PR and changed 12
      # workflow files.
      #
      # No permissions: key lifts that restriction - `workflows` is a PAT/OAuth
      # scope, not an Actions permission, and setting it makes the whole
      # workflow fail to parse. Creating the ref through the API sidesteps the
      # push path: it points a new ref at a commit that is already on main, so
      # no workflow file is created or updated.
      - env:
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ needs.verify.outputs.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Resolve the tag from the API rather than a checkout, so the result
          # is the remote's truth and not a function of what was fetched.
          if ref=$(gh api "repos/${REPO}/git/ref/tags/${TAG}" 2>/dev/null); then
            target=$(echo "${ref}" | jq -r .object.sha)
            # An annotated tag's ref points at the tag object, not the commit.
            if [ "$(echo "${ref}" | jq -r .object.type)" = "tag" ]; then
              target=$(gh api "repos/${REPO}/git/tags/${target}" --jq .object.sha)
            fi
            [ "${target}" = "${SHA}" ] || { echo "::error::immutable tag points elsewhere"; exit 1; }
            echo "tag ${TAG} already points at ${SHA}"
          else
            obj=$(gh api "repos/${REPO}/git/tags" \
              -f tag="${TAG}" \
              -f message="Release ${TAG}" \
              -f object="${SHA}" \
              -f type=commit \
              --jq .sha)
            gh api "repos/${REPO}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${obj}" >/dev/null
            echo "created ${TAG} at ${SHA}"
          fi

  publish-artifacts:
    name: "release:artifact"
    needs: [verify, tag]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/release-image.yml
    with:
      tag: ${{ needs.verify.outputs.tag }}

  publish-release:
    name: "release:publish"
    needs: [verify, publish-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft | grep -qx true || {
            echo "::error::expected an existing draft release for ${TAG}"; exit 1;
          }
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
