name: PR Release Metadata

on:
  pull_request:
    # `edited` is in this list because a pull request's base branch changing is
    # an edit, and in a stacked workflow bases change on their own: when the PR
    # below merges, this one is retargeted onto main automatically. Without
    # `edited` that retarget fires no event in this list and the gate would
    # never have run against the base the PR actually merges into.
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]
    # Deliberately no `branches` filter. Restricting this to PRs targeting main
    # checks only the bottom of a stack: every layer above it targets the layer
    # below and would reach main unchecked, carrying no release label and no
    # changelog fragment of its own. The job reads changed files from the PR's
    # own base, so on a stacked PR it sees just that layer's diff - which is
    # exactly what each layer has to account for.

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Cancel superseded pull request runs; never cancel a run on main or a
  # scheduled run, whose results are recorded against the default branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-release-label:
    name: "meta:release-label"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release label and changelog fragments
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CHANGED_FILES_URL: ${{ github.event.pull_request.url }}/files?per_page=100
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${HEAD_BRANCH}" = "release/next" ] && \
             [ "${HEAD_REPO}" = "${GITHUB_REPOSITORY}" ] && \
             echo "${LABELS_JSON}" | jq -e 'index("autorelease: pending") != null' >/dev/null; then
            echo "Generated release PR metadata is valid."
            exit 0
          fi

          count=$(echo "${LABELS_JSON}" | jq '[.[] | select(
            . == "release/major" or
            . == "release/minor" or
            . == "release/patch" or
            . == "release/skip"
          )] | length')

          if [ "${count}" -ne 1 ]; then
            echo "::error::Exactly one of release/major, release/minor, release/patch or release/skip must be set on the PR (found ${count})."
            exit 1
          fi
          label=$(echo "${LABELS_JSON}" | jq -r '.[] | select(. == "release/major" or . == "release/minor" or . == "release/patch" or . == "release/skip")')
          fragment_files=$(gh api --paginate "${CHANGED_FILES_URL}" --jq \
            '.[] | select(.status != "removed" and (.filename | startswith(".changes/unreleased/") and endswith(".yaml"))) | .filename')
          fragments=$(printf '%s\n' "${fragment_files}" | sed '/^$/d' | wc -l | tr -d ' ')
          printf '%s\n' "${fragment_files}" | while IFS= read -r fragment; do
            [ -n "${fragment}" ] || continue
            kind=$(yq -r '.kind // ""' "${fragment}")
            body=$(yq -r '.body // ""' "${fragment}")
            echo "${kind}" | grep -Eq '^(Added|Changed|Deprecated|Removed|Fixed|Security|Dependencies)$' || {
              echo "::error::${fragment} has an unsupported changelog kind"; exit 1;
            }
            [ -n "${body}" ] || { echo "::error::${fragment} has an empty body"; exit 1; }
          done

          if [ "${label}" = "release/skip" ] && [ "${fragments}" -ne 0 ]; then
            echo "::error::release/skip PRs must not add changelog fragments."
            exit 1
          fi
          if [ "${label}" != "release/skip" ] && [ "${fragments}" -lt 1 ]; then
            echo "::error::A non-skip PR requires at least one .changes/unreleased/*.yaml fragment."
            exit 1
          fi
          echo "Release metadata check passed."
