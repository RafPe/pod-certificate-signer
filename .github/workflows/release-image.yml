name: Release Artifacts

# Tags and releases published by the release workflow are created with the
# workflow GITHUB_TOKEN, and GitHub never triggers workflows from events
# created by that token. The release workflow therefore invokes this one
# directly via workflow_call. The tag push trigger covers manually pushed
# tags, and workflow_dispatch allows backfilling artifacts for an existing
# release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      tag:
        description: The release tag (vX.Y.Z) to build and publish artifacts for.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag (vX.Y.Z) to build and publish artifacts for.
        required: true
        type: string

permissions: {}

env:
  # Keep in sync with the IMAGE default in the Makefile and the Helm chart
  # image.repository value.
  IMAGE_REPO: ghcr.io/rafpe/pod-certificate-signer
  # OCI registry namespace the Helm chart is pushed to; the chart lands at
  # ghcr.io/rafpe/charts/podcertificate-signer.
  CHART_REPO: ghcr.io/rafpe/charts

jobs:
  build-and-push:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern=v{{major}},value=${{ env.RELEASE_TAG }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-chart:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    # Publish the chart only once its default image tag (the appVersion)
    # actually exists in the registry.
    needs: build-and-push
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package the chart
        run: |
          VERSION="${RELEASE_TAG#v}"
          helm package charts/podcertificate-signer \
            --version "${VERSION}" \
            --app-version "${RELEASE_TAG}"

      - name: Push the chart
        run: |
          VERSION="${RELEASE_TAG#v}"
          helm push "podcertificate-signer-${VERSION}.tgz" "oci://${CHART_REPO}"
