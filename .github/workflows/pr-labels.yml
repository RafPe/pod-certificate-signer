name: PR Release Label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches:
      - main

permissions: {}

jobs:
  check-release-label:
    name: Require exactly one release label
    runs-on: ubuntu-latest
    steps:
      - name: Check that exactly one release/* label is set
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          count=$(echo "${LABELS_JSON}" | jq '[.[] | select(
            . == "release/major" or
            . == "release/minor" or
            . == "release/patch" or
            . == "release/skip"
          )] | length')

          if [ "${count}" -ne 1 ]; then
            echo "::error::Exactly one of release/major, release/minor, release/patch or release/skip must be set on the PR (found ${count})."
            exit 1
          fi
          echo "Release label check passed."
