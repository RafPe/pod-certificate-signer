name: E2E Tests

on:
  pull_request:
  workflow_call:
    inputs:
      target_ref:
        description: Commit to test; defaults to the triggering commit.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-e2e:
    name: "test:e2e"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_ref || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # kind comes from the tools module (internal/tools/go.mod), the same
      # binary the Makefile runs the suite with. It used to be curl'd from
      # kind.sigs.k8s.io, which redirects to GitHub release assets; a transient
      # 504 there failed the whole job before a single spec ran, for a binary
      # the suite never used. The module proxy is already warm from setup-go's
      # cache, so this adds no extra network hop and no second version to pin.
      - name: Verify kind installation
        run: go tool -modfile internal/tools/go.mod kind version

      # The e2e package is behind //go:build e2e, so the repo-wide `go vet ./...`
      # and `golangci-lint run` never look at it. Gate it here, before the
      # 10-minute cluster run, so a compile-level mistake fails in seconds.
      - name: Vet and lint the tagged e2e package
        run: make vet-e2e lint-e2e

      - name: Running Test e2e
        run: make test-e2e

      # make test-e2e tears the cluster down from an EXIT trap, so this is a
      # backstop for the cases the trap cannot cover: a cancelled job, or a
      # runner-level timeout that kills make outright.
      - name: Tear down the kind cluster
        if: always()
        run: go tool -modfile internal/tools/go.mod kind delete cluster --name pcs-e2e || true
